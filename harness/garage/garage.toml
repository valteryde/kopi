# Dev values. They match .env.example. This file is not the pattern for the image.

metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "sqlite"
replication_factor = 1

rpc_bind_addr = "0.0.0.0:3901"
rpc_public_addr = "127.0.0.1:3901"
rpc_secret = "abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789"

allow_world_readable_secrets = true

[s3_api]
api_bind_addr = "0.0.0.0:3900"
s3_region = "garage"
root_domain = ".s3.garage.localhost"

[admin]
api_bind_addr = "0.0.0.0:3903"
admin_token = "kopi-dev-admin-token-0123456789abcdef"
